# Root CI config - delegates to android subfolder
stages:
  - build

build_android:
  image: jangrewe/gitlab-ci-android
  stage: build
  variables:
    ANDROID_COMPILE_SDK: "34"
    ANDROID_BUILD_TOOLS: "34.0.0"
  before_script:
    - cd android
    - export GRADLE_USER_HOME=$(pwd)/.gradle
    - chmod +x ./gradlew
  script:
    - ./gradlew assembleDebug
  artifacts:
    paths:
      - android/app/build/outputs/apk/debug/app-debug.apk
    expire_in: 30 days
    name: "emoji-mosaic-${CI_COMMIT_SHORT_SHA}"
  cache:
    key: android-${CI_COMMIT_REF_SLUG}
    paths:
      - android/.gradle/
