image: eclipse-temurin:17-jdk

variables:
  ANDROID_COMPILE_SDK: "34"
  ANDROID_BUILD_TOOLS: "34.0.0"
  ANDROID_SDK_TOOLS: "11076708"

stages:
  - build

build_android:
  stage: build
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
  before_script:
    - apt-get update -qq && apt-get install -y -qq wget unzip > /dev/null 2>&1

    # Install Android SDK
    - export ANDROID_HOME="${PWD}/android-sdk-root"
    - export PATH=$PATH:${ANDROID_HOME}/cmdline-tools/latest/bin:${ANDROID_HOME}/platform-tools
    - mkdir -p ${ANDROID_HOME}/cmdline-tools
    - wget -q https://dl.google.com/android/repository/commandlinetools-linux-${ANDROID_SDK_TOOLS}_latest.zip -O /tmp/cmdline-tools.zip
    - unzip -q /tmp/cmdline-tools.zip -d ${ANDROID_HOME}/cmdline-tools
    - mv ${ANDROID_HOME}/cmdline-tools/cmdline-tools ${ANDROID_HOME}/cmdline-tools/latest

    # Accept licenses and install SDK
    - yes | sdkmanager --licenses > /dev/null 2>&1 || true
    - sdkmanager "platforms;android-${ANDROID_COMPILE_SDK}" "build-tools;${ANDROID_BUILD_TOOLS}" > /dev/null 2>&1

    # Setup Gradle wrapper
    - cd android
    - mkdir -p gradle/wrapper
    - wget -q https://services.gradle.org/distributions/gradle-8.2-bin.zip -O /tmp/gradle.zip
    - unzip -q /tmp/gradle.zip -d /tmp/gradle
    - /tmp/gradle/gradle-8.2/bin/gradle wrapper --gradle-version 8.2
    - chmod +x ./gradlew

  script:
    - ./gradlew assembleDebug --no-daemon --stacktrace

  artifacts:
    when: on_success
    paths:
      - android/app/build/outputs/apk/debug/app-debug.apk
    expire_in: 30 days
    name: "emoji-mosaic-apk"

  cache:
    key: android-sdk-and-gradle
    paths:
      - android-sdk-root/
      - android/.gradle/
