stages:
  - build

build_android:
  image: cimg/android:2024.01
  stage: build
  variables:
    GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.workers.max=2"
  before_script:
    - cd android
    # Generate Gradle wrapper if not present
    - gradle wrapper --gradle-version 8.2
    - chmod +x ./gradlew
  script:
    - ./gradlew assembleDebug --stacktrace
  artifacts:
    paths:
      - android/app/build/outputs/apk/debug/app-debug.apk
    expire_in: 30 days
    name: "emoji-mosaic-${CI_COMMIT_SHORT_SHA}"
  cache:
    key: android-gradle-${CI_COMMIT_REF_SLUG}
    paths:
      - android/.gradle/
      - android/build/
      - android/app/build/
  tags: []
